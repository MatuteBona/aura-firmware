# Manifiesto del conector del locker del pañol (LabECA). Una placa por locker.
# Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E1-PB-LECA-PUE01"
version = "0.2.0"
sdk     = ">=1.2,<2"
autores = ["MatuteBona", "agusferrero05", "bertolaco"]
clase   = "conector:ConectorLocker"

# Un bloque por cada campo que manda el firmware en "values" (dispositivos/E1-PB-LECA-PUE01,
# "Lo que envía a AURA"). Son estados: 1 o 0. Lo que no esté acá, o esté fuera de rango, AURA
# no lo guarda.

[campos.puerta]
unidad   = "0/1"
min      = 0
max      = 1
etiqueta = "Puerta del locker (1 = abierta)"
rol      = "principal"

[campos.cerradura]
unidad   = "0/1"
min      = 0
max      = 1
etiqueta = "Cerradura (1 = energizada)"
rol      = "auxiliar"
