# Manifiesto del conector del gabinete de lockers del pañol (LabECA).
# Ver CONTRIBUTING.md, "Tu conector".
nombre  = "E1-PB-LECA-LCK01"
version = "0.1.0"
sdk     = ">=1.2,<2"
autores = ["MatuteBona"]
clase   = "conector:ConectorLockers"

# Un bloque por cada campo que manda el firmware en "values" (dispositivos/E1-PB-LECA-LCK01,
# "Lo que envía a AURA"). Son estados: 1 o 0. Lo que no esté acá, o esté fuera de rango, AURA
# no lo guarda.

[campos.puerta_1]
unidad   = "0/1"
min      = 0
max      = 1
etiqueta = "Puerta del locker 1 (1 = abierta)"
rol      = "principal"

[campos.solenoide_1]
unidad   = "0/1"
min      = 0
max      = 1
etiqueta = "Cerradura del locker 1 (1 = liberada)"
rol      = "auxiliar"
